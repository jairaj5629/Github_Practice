name: Context Variables demo
on: push
jobs:
  context_demo:
     runs-on: ubuntu-latest
     steps:
     - name: Use context variables
       run: |
         echo "This workflow is triggered by ${{github.actor}}"
         echo "This repository is triggered by ${{github.repository}}"
         echo "This branch is ${{github.ref_name}}"
         
     - name:  print all variable under github
       run: echo"${{tojson(github)}}"    
     - name:  print all variable under github
       run: echo"$GITHUB_SHA"
        
     
         
         
